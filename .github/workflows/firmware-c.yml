name: Firmware (C probe fork)

# Manual-only, mirroring PicoInky's firmware.yml: only fires when a human clicks "Run workflow"
# (or `gh workflow run firmware-c.yml -f version=X.Y.Z`) — never on push/PR/tag.
#
# Hackagotchi is a PUBLIC repo, so it cannot use the org's self-hosted `omen` runner group
# (private-repos only); GitHub-hosted minutes are free for public repos, so this runs on
# ubuntu-latest instead. There is no persistent runner-local toolchain cache here, so the pinned
# Arm GCC 13.3.Rel1 + pico-sdk 2.2.0 (the same versions the proven local build_fork.sh recipe
# expects) are fetched into a job-local $HOME/fw-build and kept warm across runs with
# actions/cache.
#
# Builds the Hackagotchi probe fork (debugprobe-v2.2.3 overlay) and runs the static-analysis gate.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Firmware version (e.g. 0.1.0). Tag will be v<version> if publishing."
        type: string
        required: true
      publish_release:
        description: "Publish a GitHub Release with the .uf2 + .elf (otherwise just artifacts)."
        type: boolean
        default: false

concurrency:
  group: firmware-c-build
  cancel-in-progress: false

permissions:
  contents: write   # for the optional Release

jobs:
  build:
    name: Build + static-analysis gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure build paths
        run: |
          echo "FW_BUILD_DIR=$HOME/fw-build" >> "$GITHUB_ENV"
          echo "GCC_DIR=$HOME/fw-build/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi" >> "$GITHUB_ENV"
          echo "PICO_SDK_PATH=$HOME/fw-build/micropython/lib/pico-sdk" >> "$GITHUB_ENV"

      - name: Cache Arm toolchain + pico-sdk
        id: fwbuild-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FW_BUILD_DIR }}
          key: fwbuild-arm-gnu-13.3.rel1-picosdk-2.2.0-${{ runner.os }}

      - name: Install build dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential cppcheck python3

      - name: Install pinned Arm GNU Toolchain 13.3.Rel1 (Linux x86_64)
        if: steps.fwbuild-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$FW_BUILD_DIR"
          curl -fsSL -o /tmp/arm-gnu-toolchain.tar.xz \
            "https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz"
          tar -xJf /tmp/arm-gnu-toolchain.tar.xz -C "$FW_BUILD_DIR"

      - name: Fetch pico-sdk 2.2.0 (with submodules)
        if: steps.fwbuild-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$PICO_SDK_PATH")"
          git clone --branch 2.2.0 --depth 1 --recurse-submodules https://github.com/raspberrypi/pico-sdk.git "$PICO_SDK_PATH"

      - name: Add pinned Arm GCC to PATH
        run: echo "$GCC_DIR/bin" >> "$GITHUB_PATH"

      - name: Fetch upstream (debugprobe-v2.2.3)
        working-directory: firmware/c
        run: |
          set -euo pipefail
          ./setup.sh

      - name: Build fork (pinned Arm GCC 13.3 + pico-sdk 2.2.0)
        id: build
        working-directory: firmware/c
        run: |
          set -euo pipefail
          # Thread the release semver into the binary so {"q":"status"} reports "ver" matching the tag.
          VERSION='${{ inputs.version }}' ./build_fork.sh
          echo "uf2=$(pwd)/build/hackagotchi_probe.uf2" >> "$GITHUB_OUTPUT"
          echo "elf=$(pwd)/build/hackagotchi_probe.elf" >> "$GITHUB_OUTPUT"
          # Provenance: the descriptor + pin map are embedded; surface them in the log.
          picotool info -a build/hackagotchi_probe.uf2 || true

      - name: Static-analysis gate (GCC -fanalyzer + cppcheck)
        working-directory: firmware/c
        run: ./analyze.sh

      - name: Upload artifacts (.uf2 + .elf — .elf needed to symbolicate fault dumps)
        uses: actions/upload-artifact@v7
        with:
          name: hackagotchi-probe-c-${{ inputs.version }}
          path: |
            firmware/c/build/hackagotchi_probe.uf2
            firmware/c/build/hackagotchi_probe.elf
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          # Release notes: prefer a curated docs/RELEASE_NOTES_v<ver>.md, else the CHANGELOG section, else a default.
          notes="$(mktemp)"
          rel="docs/RELEASE_NOTES_v${{ inputs.version }}.md"
          if [ -f "$rel" ]; then
            cp "$rel" "$notes"; echo "(release notes from $rel)"
          elif awk -v v="${{ inputs.version }}" '
                $0 ~ "^## \\[?"v"\\]?([^0-9]|$)" {grab=1; next}
                grab && /^## / {exit}
                grab {print}
              ' CHANGELOG.md > "$notes" 2>/dev/null && [ -s "$notes" ]; then
            echo "(release notes sourced from CHANGELOG.md)"
          else
            echo "debugprobe-v2.2.3 fork: CMSIS-DAP probe + UART bridge + JSON-control CDC + SD black-box recorder + OLED dashboard. Static-analysis gate green; HIL gates attested on the release image (see docs/release-readiness.md)." > "$notes"
          fi
          # Attach the binaries + the attribution docs the NOTICE requires shipping with the image.
          gh release create "$tag" \
            --title "Hackagotchi probe firmware (C) v${{ inputs.version }}" \
            --notes-file "$notes" \
            firmware/c/build/hackagotchi_probe.uf2 \
            firmware/c/build/hackagotchi_probe.elf \
            firmware/c/THIRD-PARTY-NOTICES.md \
            firmware/c/LICENSE

  # The portable-logic host tests (SPSC ring, recorder wedge/heartbeat machine, sprite blit) run in the
  # separate, GitHub-HOSTED host-tests.yml (push/PR) — they need no probe, so they don't belong on this
  # manual build job. Each runs its verify-the-verifier break build too, so the check can fail.
